# 拼多多 AI 自动客服配置
pdd:
  api_version: "202506091557"   # 拼多多 WebSocket API 版本（实测确认）
  base_ws_url: "wss://m-ws.pinduoduo.com/"
  http_base: "https://mms.pinduoduo.com"
  cdp_port: 9222   # 本地调试 Chrome 端口（登录态绑定浏览器会话）

polling:
  conversation_cooldown_seconds: 60   # 每会话回复后冷却
  global_rate_limit_seconds: 10       # 全局两条回复最小间隔
  daily_reply_limit: 100              # 每日自动回复上限

reconnect:
  max_attempts: 5      # 最大重连次数
  initial_delay: 2.0   # 初始重连延迟(秒)
  backoff_factor: 2.0  # 退避因子
  max_delay: 60.0      # 最大重连延迟(秒)

ai:
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  max_history_messages: 20   # 传给 AI 的最大历史消息数

shop_context:
  file: "data/knowledge_base.md"   # 客服话术库，作为 AI 店铺上下文

fallback_text: "亲，感谢您的咨询！客服正在为您处理，请稍等片刻。"

business_hours:
  start: "08:00"
  end: "23:00"
